name: Weekly Gousto shortlist

on:
  schedule:
    - cron: "30 13 * * 2"   # Tuesdays 13:30 UTC, just after the weekly menu rolls over at 12:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch menu and rank
        run: |
          python -m picker || {
            echo "API route failed, trying Playwright"
            pip install playwright && playwright install --with-deps chromium
            python -m picker
          }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
